---

- name: Check Homebrew is installed
  ansible.builtin.command: which brew
  register: homebrew_check
  failed_when:
    - homebrew_check.rc != 0
  ignore_errors: false
  changed_when: false # Don't mark this as a change
  check_mode: false

- name: Tap additional Homebrew repositories
  community.general.homebrew_tap:
    name: "{{ item }}"
  loop: "{{ homebrew_taps }}"
  when:
    - homebrew_check.rc == 0
    - homebrew_taps | length > 0

- name: Update and upgrade Homebrew packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
  when: homebrew_check.rc == 0

- name: Install packages with Homebrew
  community.general.homebrew:
    name: "{{ homebrew_install_packages }}"
    state: present
  when:
    - homebrew_check.rc == 0
    - homebrew_install_packages | length > 0
